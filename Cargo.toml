[workspace]
members = ["crates/moss-cli"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
sha2 = "0.10"

[profile.release]
# The driver is a thin shell around Binaryen and Wasmtime, so almost all of
# what it links is Clap and the standard library. Giving the optimizer one
# unit to work in lets the linker drop monomorphizations nothing reaches,
# which is a sixth of the executable. The Nix `default` package widens this
# to whole-program LTO, which the bundles cannot use.
codegen-units = 1
