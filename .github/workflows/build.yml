name: Build
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      lock-artifact:
        description: Artifact containing the updated flake.lock
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            artifact: moss-linux-x86
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            artifact: moss-linux-arm
          - system: aarch64-darwin
            runner: macos-26
            artifact: moss-macos-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: inputs.lock-artifact != ''
        with:
          name: ${{ inputs.lock-artifact }}
      - run: nix flake check --print-build-logs
      - name: Stage the standalone bundle
        run: |
          package=$(nix build --no-link --print-out-paths --print-build-logs .#standalone)
          cp -RL "$package" bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bundle
      - name: Stage the Windows bundle
        if: matrix.system == 'x86_64-linux'
        run: |
          package=$(nix build --no-link --print-out-paths --print-build-logs .#windows)
          cp -RL "$package" windows-bundle
      - uses: actions/upload-artifact@v7
        if: matrix.system == 'x86_64-linux'
        with:
          name: moss-windows-x86
          path: windows-bundle

  smoke:
    name: ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            runner: ubuntu-24.04
            artifact: moss-linux-x86
          - name: linux-arm
            runner: ubuntu-24.04-arm
            artifact: moss-linux-arm
          - name: macos-arm
            runner: macos-26
            artifact: moss-macos-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: moss
      - run: |
          chmod +x moss/bin/moss
          ./moss/bin/moss examples/hello.moss | grep -qx 'Hello, world!'

  windows-x86:
    needs: build
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: moss-windows-x86
          path: moss
      - run: |
          $output = .\moss\bin\moss.exe examples\hello.moss
          if ($LASTEXITCODE -ne 0 -or $output -cne 'Hello, world!') { exit 1 }
